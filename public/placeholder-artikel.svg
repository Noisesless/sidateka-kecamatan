<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="225" r="220" fill="#38bdf8" opacity="0.07" />
  <circle cx="680" cy="100" r="150" fill="#10b981" opacity="0.05" />

  <!-- Center Card Frame -->
  <rect x="230" y="105" width="340" height="240" rx="16" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Newspaper / News Icon Illustration -->
  <g transform="translate(364, 130)">
    <!-- Document background -->
    <rect x="0" y="0" width="72" height="84" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
    <!-- Image placeholder box inside icon -->
    <rect x="10" y="10" width="52" height="30" rx="4" fill="#334155" />
    <!-- Mountain/Sun in image -->
    <circle cx="22" cy="20" r="4" fill="#38bdf8" />
    <path d="M12 36 L24 24 L34 32 L46 18 L60 36 Z" fill="#38bdf8" opacity="0.7" />
    <!-- Text lines -->
    <rect x="10" y="48" width="52" height="4" rx="2" fill="#94a3b8" />
    <rect x="10" y="58" width="40" height="4" rx="2" fill="#64748b" />
    <rect x="10" y="68" width="46" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- Typography -->
  <text x="400" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#38bdf8">KECAMATAN BANJARMANGU</text>
  <text x="400" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">SIDATEKA PORTAL DESA</text>
  <text x="400" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Dokumentasi &amp; Berita Terkini</text>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="444" width="800" height="6" fill="url(#accent)" />
</svg>
